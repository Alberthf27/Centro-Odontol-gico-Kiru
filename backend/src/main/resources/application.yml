spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: kiru-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  reservas:
    precio-consulta: ${PRECIO_CONSULTA:50.00}
  demo:
    enabled: ${KIRU_DEMO_ENABLED:false}
    auth-user-id: ${KIRU_DEMO_AUTH_USER_ID:00000000-0000-0000-0000-000000000001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
