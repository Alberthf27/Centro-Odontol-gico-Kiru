<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorear citas · KIRU Recepción</title>
    <meta name="description" content="Monitorea las citas del día, busca clientes por DNI o nombre y gestiona citas desde recepción.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../cliente/css/styles.css">
    <link rel="stylesheet" href="../cliente/css/dashboard.css">
    <link rel="stylesheet" href="../cliente/css/mis-citas.css?v=3">
    <link rel="stylesheet" href="css/monitorear-citas.css?v=1">
    <script src="../cliente/js/auth.js?v=4" defer></script>
    <script src="../cliente/js/api.js" defer></script>
    <script src="js/recepcion-api.js?v=1" defer></script>
    <script src="js/monitorear-citas.js?v=1" defer></script>
</head>
<body class="dash-body" data-requires-role="RECEPCIONISTA">
    <div class="dash-shell">

        <!-- Sidebar con la misma identidad visual del módulo de cliente. -->
        <aside class="dash-sidebar">
            <a href="monitorear-citas.html" class="logo logo--on-dark">
                <span class="logo-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" width="22" height="22" fill="none">
                        <path d="M16 4c-3.6 0-6.4 1.7-8.4 1.7-1.7 0-2.6-.9-2.6-.9S4 6.7 4 10.4c0 4.6 1.6 9 2.9 12.6.9 2.5 1.7 4.6 3.2 4.6 1.9 0 2-4.3 2.9-7.4.4-1.4 1-2.5 2-2.5s1.6 1.1 2 2.5c.9 3.1 1 7.4 2.9 7.4 1.5 0 2.3-2.1 3.2-4.6C24.4 19.4 26 15 26 10.4c0-3.7-1-4.6-1-4.6s-.9.9-2.6.9C20.4 5.7 19.6 4 16 4z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="logo-text">KIRU</span>
            </a>

            <nav class="dash-nav" aria-label="Navegación de recepción">
                <a href="monitorear-citas.html" class="dash-nav-item is-active">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3.5v3M16 3.5v3"/><path d="M9 14.5l2 2 4-4"/></svg>
                    <span>Monitorear citas</span>
                </a>
            </nav>

            <div class="recepcion-badge">Recepción</div>

            <button type="button" class="dash-logout" data-action="logout">
                <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2v-2"/><path d="M9 12h11m0 0-3.5-3.5M20 12l-3.5 3.5"/></svg>
                <span>Cerrar sesión</span>
            </button>
        </aside>

        <!-- CONTENIDO -->
        <div class="dash-main-wrap">

            <header class="dash-topbar">
                <div>
                    <h1 class="dash-title">Monitorear citas del cliente</h1>
                    <p class="dash-date" id="todayLabel"></p>
                </div>
            </header>

            <!-- Estructura prevista en el prototipo: búsqueda por DNI o nombre, datos del
                 cliente y acciones de recepción sobre la cita seleccionada. -->
            <div class="monitor-panel">
                <section class="card buscar-cliente-card" aria-labelledby="buscarClienteTitle">
                    <div class="card-header">
                        <h3 id="buscarClienteTitle">Buscar cliente</h3>
                    </div>
                    <div class="buscar-cliente-grid">
                        <div class="buscar-col">
                            <label class="filter-label" for="dniInput">Buscar por DNI o nombre</label>
                            <div class="dni-row">
                                <input type="text" id="dniInput" inputmode="search" placeholder="DNI o nombre completo" autocomplete="off">
                                <button type="button" class="btn-primary btn-ghost--sm" id="searchClient">Buscar</button>
                            </div>
                            <p class="field-error" id="dniError" hidden></p>
                            <div class="buscar-col-actions">
                                <button type="button" class="btn-primary btn-block" id="newClient">Nuevo cliente</button>
                                <button type="button" class="btn-ghost btn-block" id="clearSearch">Limpiar</button>
                            </div>
                        </div>
                        <div class="cliente-datos">
                            <label class="filter-label" for="clienteNombres">Nombres</label>
                            <input type="text" id="clienteNombres" readonly tabindex="-1">
                            <label class="filter-label" for="clienteApellidos">Apellidos</label>
                            <input type="text" id="clienteApellidos" readonly tabindex="-1">
                            <label class="filter-label" for="clienteCelular">Celular</label>
                            <input type="text" id="clienteCelular" readonly tabindex="-1" placeholder="xxxx xxx">
                        </div>
                    </div>
                </section>

                <section class="monitor-actions" aria-label="Acciones de recepción">
                    <button type="button" class="btn-primary action-btn" id="actionNuevaCita" disabled>Nueva cita</button>
                    <button type="button" class="btn-primary action-btn" id="actionAsistencia" disabled>Asistencia</button>
                    <button type="button" class="btn-primary action-btn" id="actionReprogramar" disabled>Reprogramar</button>
                    <button type="button" class="btn-ghost btn-danger action-btn" id="actionCancelar" disabled>Cancelar</button>
                </section>
            </div>

            <div class="citas-wrap monitor-citas">
                <div class="filter-bar citas-filter-bar">
                    <h3 class="citas-section-title">Citas médicas</h3>
                    <div class="filter-dates">
                        <label class="filter-label">Filtrar por fecha <small class="filter-hint">(vacío = todas)</small>
                            <input type="date" id="dateFilter">
                        </label>
                        <button type="button" class="btn-primary btn-ghost--sm" id="searchByDate">Buscar</button>
                    </div>
                </div>

                <div class="citas-table-wrap">
                    <table class="citas-table">
                        <thead>
                            <tr>
                                <th>ID cita</th>
                                <th>Fecha de realización</th>
                                <th>Hora</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Doctor asignado</th>
                                <th>Detalles</th>
                            </tr>
                        </thead>
                        <tbody id="citasList"></tbody>
                    </table>
                </div>
                <p class="empty-citas" id="emptyCitas" hidden>No hay citas registradas.</p>
            </div>
        </div>
    </div>

    <!-- Modal de las acciones de recepción (nuevo cliente, nueva cita,
         asistencia, reprogramar, cancelar). -->
    <div class="modal-overlay" id="modalOverlay" hidden>
        <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
